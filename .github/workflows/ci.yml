name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # macOS runners are advisory: allocations are occasionally cancelled by
    # GitHub before any step starts. Linux jobs remain the merge gate.
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux GCC
            os: ubuntu-latest
            cc: gcc
            cxx: g++
          - name: Linux Clang
            os: ubuntu-latest
            cc: clang
            cxx: clang++
          - name: macOS Apple Clang
            os: macos-latest
            cc: clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          if ! command -v ninja >/dev/null 2>&1; then
            if [ "$RUNNER_OS" = "Linux" ]; then
              sudo apt-get update
              sudo apt-get install -y ninja-build
            else
              brew install ninja
            fi
          fi

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DCPPQUANT_WERROR=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Benchmark smoke test
        run: ./build/orderbook_bench --quick

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-asan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCPPQUANT_SANITIZE=ON
          -DCPPQUANT_WERROR=ON

      - name: Build
        run: cmake --build build-asan --parallel

      - name: Test
        run: ctest --test-dir build-asan --output-on-failure

  thread-sanitizer:
    name: TSan
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      TSAN_OPTIONS: halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-tsan -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCPPQUANT_TSAN=ON
          -DCPPQUANT_WERROR=ON

      - name: Build
        run: cmake --build build-tsan --parallel

      - name: Test
        run: ctest --test-dir build-tsan -R orderbook_tests --output-on-failure

  fuzz-smoke:
    name: libFuzzer decoder and replay
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
      ASAN_OPTIONS: detect_leaks=0
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Configure
        run: >
          cmake -S . -B build-fuzz -G Ninja
          -DCMAKE_BUILD_TYPE=Debug
          -DCPPQUANT_FUZZ=ON
          -DCPPQUANT_SANITIZE=ON
          -DCPPQUANT_BUILD_TESTS=OFF
          -DCPPQUANT_BUILD_BENCHMARKS=OFF
          -DCPPQUANT_BUILD_EXAMPLES=OFF
          -DCPPQUANT_WERROR=ON

      - name: Build fuzz targets
        run: cmake --build build-fuzz --target fuzz_market_data fuzz_replay

      - name: Fuzz market data
        run: ./build-fuzz/fuzz_market_data fuzz/corpus/market_data -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1

      - name: Fuzz replay parser
        run: ./build-fuzz/fuzz_replay fuzz/corpus/replay -max_total_time=60 -rss_limit_mb=2048 -print_final_stats=1

  package:
    name: Install and consume package
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCPPQUANT_BUILD_TESTS=OFF \
            -DCPPQUANT_BUILD_BENCHMARKS=OFF \
            -DCPPQUANT_BUILD_EXAMPLES=OFF
          cmake --build build --parallel
          cmake --install build --prefix "$PWD/install"

      - name: Build a downstream consumer
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.20)
          project(cppquant_consumer LANGUAGES CXX)
          find_package(cppquant CONFIG REQUIRED)
          add_executable(consumer main.cpp)
          target_link_libraries(consumer PRIVATE cppquant::orderbook)
          EOF
          cat > consumer/main.cpp <<'EOF'
          #include <cppquant/orderbook.hpp>
          #include <cassert>

          int main() {
            cppquant::OrderBook book;
            book.add_limit_order(1, cppquant::Side::Sell, 100, 5);
            auto result = book.add_market_order(2, cppquant::Side::Buy, 5);
            assert(result.filled == 5);
            assert(book.empty());
            return 0;
          }
          EOF
          cmake -S consumer -B consumer/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="$PWD/install"
          cmake --build consumer/build --parallel
          ./consumer/build/consumer
